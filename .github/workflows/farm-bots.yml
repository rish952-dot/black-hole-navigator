name: Evolutionary Farm Bots

on:
  workflow_dispatch:
    inputs:
      start_five:
        description: "Run the first 5 bots in PAPER_MODE"
        required: true
        type: boolean
        default: false
      generations:
        description: "Generations per bot"
        required: false
        default: "1"
      population:
        description: "Population inside each bot"
        required: false
        default: "10"
      opportunities:
        description: "Synthetic opportunities per generation"
        required: false
        default: "200"
      payout_address:
        description: "Public EVM address for the common payout proposal destination"
        required: false
        default: ""
      payout_asset:
        description: "Accounting asset for payout proposals"
        required: false
        default: "USDC"
        type: choice
        options: [USDC, USDT, ETH]
      payout_share:
        description: "Profit share used only to build payout proposals"
        required: false
        default: "0.5"
  push:
    branches:
      - Work/ai-farm-audit

permissions:
  contents: read

concurrency:
  group: farm-bots-${{ github.ref }}
  cancel-in-progress: true

jobs:
  approval:
    name: Admin approval — first 5 bots (paper mode)
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.start_five == true }}
    runs-on: ubuntu-latest
    environment: farm-paper-approval
    steps:
      - name: Approval recorded
        run: echo "Admin approval received; starting first five PAPER_MODE bots."

  bot:
    name: bot-${{ matrix.bot }}
    needs: approval
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.start_five == true }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        bot: [0, 1, 2, 3, 4]

    env:
      BOT_ID: ${{ matrix.bot }}
      BOT_SEED: ${{ matrix.bot }}
      GENERATIONS: ${{ inputs.generations || '1' }}
      FARM_POPULATION: ${{ inputs.population || '10' }}
      OPPORTUNITIES_PER_GEN: ${{ inputs.opportunities || '200' }}
      DEPLOYMENT_MODE: PAPER_MODE
      MAX_DAILY_SPEND: 50000
      MAX_ACCEPTABLE_LOSS: 5000
      MIN_DIVERSITY: 0.4
      FLAG_THRESHOLD: 2
      MAX_VOLATILITY: 0.8
      AUTONOMY_AUDIT_FREQUENCY: 5
      FARM_AI_ENABLED: false
      FARM_AI_API_KEY: ${{ secrets.FARM_AI_API_KEY }}
      FARM_AI_BASE_URL: ${{ secrets.FARM_AI_BASE_URL }}
      FARM_AI_MODEL: ${{ secrets.FARM_AI_MODEL }}

    steps:
      - name: Checkout audit branch
        uses: actions/checkout@v4
        with:
          ref: Work/ai-farm-audit
          fetch-depth: 1

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run bot
        run: bun run scripts/run-farm-bot.ts

      - name: Validate safety gates
        run: bun run scripts/validate-farm-safety.ts farm-bot-${{ matrix.bot }}.json

      - name: Upload bot result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: farm-bot-${{ matrix.bot }}
          path: farm-bot-${{ matrix.bot }}.json
          if-no-files-found: error

  supervisor:
    name: Farm supervisor
    needs: bot
    if: ${{ always() && github.event_name == 'workflow_dispatch' && inputs.start_five == true }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      BOT_COUNT: 5
      MAX_ACCEPTABLE_LOSS: 5000
      MIN_DIVERSITY: 0.4
      FLAG_THRESHOLD: 2
      MAX_VOLATILITY: 0.8
      PAYOUT_ADDRESS: ${{ inputs.payout_address }}
      PAYOUT_ASSET: ${{ inputs.payout_asset || 'USDC' }}
      PAYOUT_SHARE: ${{ inputs.payout_share || '0.5' }}
      PAYOUT_CHAIN: ethereum
    steps:
      - name: Checkout audit branch
        uses: actions/checkout@v4
        with:
          ref: Work/ai-farm-audit
          fetch-depth: 1

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0

      - name: Download bot results
        uses: actions/download-artifact@v4
        with:
          pattern: farm-bot-*
          path: bot-artifacts
          merge-multiple: true

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Supervise all bots
        run: |
          cp bot-artifacts/farm-bot-*.json .
          bun run scripts/supervise-farm.ts

      - name: Screen earnings and allocate hosting tiers
        run: bun run scripts/screen-agents.ts farm-bot-0.json farm-bot-1.json farm-bot-2.json farm-bot-3.json farm-bot-4.json

      - name: Build paper payout manifest
        if: always()
        run: bun run scripts/create-payout-manifest.ts

      - name: Upload supervisor outputs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: farm-supervisor
          path: |
            farm-supervisor.json
            agent-screening.json
            farm-output/payout-manifest.json
          if-no-files-found: error
