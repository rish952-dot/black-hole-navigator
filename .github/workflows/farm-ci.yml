name: Farm Branch Audit

on:
  workflow_dispatch:
  push:
    branches:
      - Work/ai-farm-audit

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout audit branch
        uses: actions/checkout@v4
        with:
          ref: Work/ai-farm-audit
          fetch-depth: 1

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install
        run: bun install --frozen-lockfile

      - name: Build
        run: bun run build

      - name: Test
        run: bun test

      - name: Lint
        run: bun run lint

      - name: Stress Test - Mesh
        env:
          MESH_NODES: "64"
          MESH_ROUNDS: "20"
          VECTORS_PER_NODE: "2"
          MESH_BUS_CAPACITY: "10000"
        run: bun run scripts/stress-mesh.ts

      - name: Upload stress test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mesh-stress-results
          path: |
            mesh-stress-results.json
            mesh-stress-result.md
            COPILOT_MESH_STRESS.md
