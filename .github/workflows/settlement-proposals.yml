name: Settlement Proposals

on:
  workflow_dispatch:
    inputs:
      payout_address:
        description: "EVM payout address"
        required: true
        type: string
      payout_asset:
        description: "Accounting asset"
        required: true
        default: "USDC"
        type: choice
        options: [USDC, USDT, ETH]
      payout_share:
        description: "Share of simulated net profit to propose"
        required: true
        default: "0.5"
        type: string

permissions:
  contents: read

jobs:
  propose:
    runs-on: ubuntu-latest
    environment: farm-settlement-approval
    steps:
      - uses: actions/checkout@v4
        with:
          ref: Work/ai-farm-audit

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0

      - run: bun install --frozen-lockfile

      - name: Run farm loop
        env:
          BOT_COUNT: "5"
          ROUNDS: "10"
          FARM_POPULATION: "10"
          OPPORTUNITIES_PER_GEN: "200"
          FARM_AI_ENABLED: "false"
        run: bun run scripts/run-farm-loop.ts

      - name: Build settlement proposals
        env:
          PAYOUT_ADDRESS: ${{ inputs.payout_address }}
          PAYOUT_ASSET: ${{ inputs.payout_asset }}
          PAYOUT_SHARE: ${{ inputs.payout_share }}
          MIN_PAYOUT_PROFIT: "1"
        run: bun run scripts/create-settlement-proposals.ts

      - name: Upload proposal artifact
        uses: actions/upload-artifact@v4
        with:
          name: settlement-proposals
          path: settlement-proposals.json
