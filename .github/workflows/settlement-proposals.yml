name: Settlement Proposals

on:
  workflow_dispatch:
    inputs:
      feed_url:
        description: "Read-only opportunity feed URL returning {opportunities:[...]}"
        required: true
        type: string
      payout_address:
        description: "EVM payout address"
        required: true
        type: string
      payout_asset:
        description: "Accounting asset"
        required: true
        default: "USDC"
        type: choice
        options: [USDC, USDT, ETH]
      payout_share:
        description: "Share of candidate net profit to propose"
        required: true
        default: "0.5"
        type: string
      rounds:
        description: "Evolution rounds"
        required: false
        default: "5"

permissions:
  contents: read

jobs:
  propose:
    runs-on: ubuntu-latest
    environment: farm-settlement-approval
    env:
      OPPORTUNITY_FEED_URL: ${{ inputs.feed_url }}
      OPPORTUNITY_FEED_TOKEN: ${{ secrets.OPPORTUNITY_FEED_TOKEN }}
      BOT_COUNT: "5"
      ROUNDS: ${{ inputs.rounds }}
      OPPORTUNITIES_PER_GEN: "500"
      PAYOUT_ADDRESS: ${{ inputs.payout_address }}
      PAYOUT_ASSET: ${{ inputs.payout_asset }}
      PAYOUT_SHARE: ${{ inputs.payout_share }}
      MIN_PAYOUT_PROFIT: "1"

    steps:
      - uses: actions/checkout@v4
        with:
          ref: Work/ai-farm-audit

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - run: bun install --frozen-lockfile

      - name: Run external opportunity candidate
        run: bun run scripts/run-production-candidate.ts

      - name: Build settlement proposals
        run: bun run scripts/create-settlement-proposals.ts production-candidate-results.json

      - name: Upload candidate report
        uses: actions/upload-artifact@v4
        with:
          name: production-candidate-${{ github.run_id }}
          path: production-candidate-results.json
          if-no-files-found: error

      - name: Upload proposal artifact
        uses: actions/upload-artifact@v4
        with:
          name: settlement-proposals-${{ github.run_id }}
          path: settlement-proposals.json
          if-no-files-found: error
