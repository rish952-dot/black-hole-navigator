<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script>
      const redirect = sessionStorage.redirect;
      delete sessionStorage.redirect;
      if (redirect && redirect !== location.href) history.replaceState(null, '', redirect);
    </script>
    <title>Black Hole Navigator</title>
  </head>
  <body>
    <div id="root"></div>
  </body>
</html>
